[package]
name = "image-gen"
version = "0.1.0"
description = "ImageGen — personal image-generation studio"
edition = "2021"
rust-version = "1.85"

[lib]
name = "image_gen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-http = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-macos-fps = "0.1"
tauri-plugin-log = "2.9.0"
log = "0.4.33"
